<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - WODBOOK</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="src/img/favicon.png">
    <link rel="shortcut icon" type="image/png" href="src/img/favicon.png">

    <!-- Para navegadores mais antigos -->
    <link rel="icon" type="image/x-icon" href="src/img/favicon.png">

    <!-- Para dispositivos Apple (iOS) -->
    <link rel="apple-touch-icon" href="src/img/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        * { font-family: 'Inter', sans-serif; }
        
        .bg-gradient-custom {
            background: linear-gradient(135deg, #F4742B 0%, #E0601A 50%, #4B4B4D 100%);
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .login-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25);
        }
        
        .btn-primary {
            background: #F4742B;
            color: white;
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            background: #E0601A;
            transform: scale(1.02);
            box-shadow: 0 4px 15px rgba(244, 116, 43, 0.4);
        }
        
        .btn-primary:active {
            transform: scale(0.98);
        }
        
        .btn-google {
            background: white;
            color: #4B4B4D;
            border: 2px solid #E5E7EB;
            transition: all 0.3s ease;
        }
        
        .btn-google:hover {
            background: #F9FAFB;
            border-color: #F4742B;
            transform: scale(1.02);
        }
        
        .input-field {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #E5E7EB;
            border-radius: 10px;
            transition: all 0.3s ease;
            outline: none;
        }
        
        .input-field:focus {
            border-color: #F4742B;
            box-shadow: 0 0 0 3px rgba(244, 116, 43, 0.1);
        }
        
        .input-field.error {
            border-color: #EF4444;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1);
        }
        
        .error-message {
            color: #EF4444;
            font-size: 14px;
            margin-top: 8px;
            display: none;
        }
        
        .error-message.show {
            display: block;
        }
        
        .success-message {
            color: #10B981;
            font-size: 14px;
            margin-top: 8px;
            display: none;
        }
        
        .success-message.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="min-h-screen bg-gradient-custom flex items-center justify-center p-4">
        <div class="login-card w-full max-w-md p-8 fade-in">
            <!-- Logo -->
           <div class="text-center mb-6">
                <div class="mx-auto w-32 h-32">
                    <img src="src/img/logo_wodbook.png" 
                        alt="Striking CT" 
                        class="w-full h-full object-contain"
                        onerror="this.src='https://ui-avatars.com/api/?name=Striking+CT&background=F4742B&color=fff&size=80'">
                </div>
                <p class="text-base font-black tracking-[0.15em] text-[#4B4B4D] mt-1.5" 
                    style="font-weight: 900;">
                        AGENDE. TREINE. SUPERE.
                </p>
                <p class="text-gray-500 text-sm mt-1">Faça login para acessar sua conta</p>
            </div>
            
            <!-- Formulário de Login -->
            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        <i class="fas fa-envelope text-[#F4742B] mr-2"></i>Email
                    </label>
                    <input 
                        type="email" 
                        id="email" 
                        class="input-field"
                        placeholder="seu@email.com"
                        required
                        autocomplete="email"
                    >
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        <i class="fas fa-lock text-[#F4742B] mr-2"></i>Senha
                    </label>
                    <input 
                        type="password" 
                        id="password" 
                        class="input-field"
                        placeholder="••••••••"
                        required
                        autocomplete="current-password"
                    >
                </div>
                
                <div class="flex items-center justify-between text-sm">
                    <label class="flex items-center gap-2 text-gray-600 cursor-pointer">
                        <input type="checkbox" class="w-4 h-4 text-[#F4742B] focus:ring-[#F4742B] border-gray-300 rounded">
                        Lembrar-me
                    </label>
                    <a href="#" class="text-[#F4742B] hover:text-[#E0601A] font-medium">Esqueceu a senha?</a>
                </div>
                
                <button 
                    type="submit" 
                    id="btnLogin"
                    class="w-full btn-primary py-3 rounded-lg font-semibold flex items-center justify-center gap-2"
                >
                    <i class="fas fa-sign-in-alt"></i>
                    Entrar
                </button>
            </form>
            
            <!-- Separador -->
            <div class="relative my-6">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-gray-200"></div>
                </div>
                <div class="relative flex justify-center text-sm">
                    <span class="px-4 bg-white text-gray-500">ou continue com</span>
                </div>
            </div>
            
            <!-- Botão Google -->
            <button 
                id="btnGoogle"
                class="w-full btn-google py-3 rounded-lg font-semibold flex items-center justify-center gap-2"
            >
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Entrar com Google
            </button>
            
            <!-- Link para cadastro -->
            <p class="text-center text-sm text-gray-600 mt-6">
                Não tem conta? 
                <a href="#" id="linkRegister" class="text-[#F4742B] font-semibold hover:underline">Cadastre-se</a>
            </p>
            
            <!-- Mensagens -->
            <div id="errorMessage" class="error-message mt-4"></div>
            <div id="successMessage" class="success-message mt-4"></div>
        </div>
    </div>
    
    <script type="module">
        import { supabase } from './src/config/supabase.js';
        
        // ============================================
        // ELEMENTOS
        // ============================================
        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const btnLogin = document.getElementById('btnLogin');
        const btnGoogle = document.getElementById('btnGoogle');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const linkRegister = document.getElementById('linkRegister');
        
        // ============================================
        // FUNÇÕES
        // ============================================
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
            successMessage.classList.remove('show');
            setTimeout(() => {
                errorMessage.classList.remove('show');
            }, 5000);
        }
        
        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.classList.add('show');
            errorMessage.classList.remove('show');
            setTimeout(() => {
                successMessage.classList.remove('show');
            }, 3000);
        }
        
        function setLoading(isLoading) {
            if (isLoading) {
                btnLogin.disabled = true;
                btnLogin.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Entrando...';
            } else {
                btnLogin.disabled = false;
                btnLogin.innerHTML = '<i class="fas fa-sign-in-alt mr-2"></i>Entrar';
            }
        }
        
        // ============================================
        // LOGIN COM EMAIL/SENHA
        // ============================================
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();
            
            if (!email || !password) {
                showError('Preencha todos os campos');
                return;
            }
            
            setLoading(true);
            
            try {
                const { data, error } = await supabase.auth.signInWithPassword({
                    email,
                    password
                });
                
                if (error) {
                    if (error.message.includes('Invalid login credentials')) {
                        throw new Error('Email ou senha inválidos');
                    } else if (error.message.includes('Email not confirmed')) {
                        throw new Error('Email não confirmado. Verifique sua caixa de entrada');
                    } else {
                        throw error;
                    }
                }
                
                showSuccess('Login realizado com sucesso! Redirecionando...');
                
                // Redirecionar para o dashboard
                setTimeout(() => {
                    window.location.href = '/index.html';
                }, 1500);
                
            } catch (error) {
                console.error('Erro no login:', error);
                showError(error.message || 'Erro ao fazer login');
                setLoading(false);
            }
        });
        
        // ============================================
        // LOGIN COM GOOGLE
        // ============================================
        btnGoogle.addEventListener('click', async () => {
            try {
                setLoading(true);
                btnGoogle.disabled = true;
                
                const { data, error } = await supabase.auth.signInWithOAuth({
                    provider: 'google',
                    options: {
                        redirectTo: window.location.origin + '/index.html'
                    }
                });
                
                if (error) throw error;
                
            } catch (error) {
                console.error('Erro no login com Google:', error);
                showError('Erro ao fazer login com Google');
                setLoading(false);
                btnGoogle.disabled = false;
            }
        });
        
        // ============================================
        // LINK PARA CADASTRO
        // ============================================
        linkRegister.addEventListener('click', (e) => {
            e.preventDefault();
            // Redirecionar para página de cadastro (se existir)
            alert('Funcionalidade de cadastro em breve!');
        });
        
        // ============================================
        // VERIFICAR SE JÁ ESTÁ LOGADO
        // ============================================
        async function checkAuth() {
            const { data: { user } } = await supabase.auth.getUser();
            if (user) {
                window.location.href = '/index.html';
            }
        }
        
        // ============================================
        // INICIALIZAÇÃO
        // ============================================
        document.addEventListener('DOMContentLoaded', checkAuth);
        
        console.log('🔐 Página de login carregada');
    </script>
</body>
</html>
