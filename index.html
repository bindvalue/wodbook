<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="src/img/favicon.png">
    <link rel="shortcut icon" type="image/png" href="src/img/favicon.png">
    <link rel="icon" type="image/x-icon" href="src/img/favicon.png">
    <link rel="apple-touch-icon" href="src/img/favicon.png">
    
    <title>WODBOOK - Agende. Treine. Supere.</title>
    <meta name="description" content="Sistema de agendamento para academias de CrossFit. Agende suas aulas, gerencie seus treinos e evolua com a WODBOOK.">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://wodbook.pages.dev/">
    <meta property="og:title" content="WODBOOK - Agende. Treine. Supere.">
    <meta property="og:description" content="Sistema de agendamento para academias de CrossFit. Agende suas aulas, gerencie seus treinos e evolua com a WODBOOK.">
    <meta property="og:image" content="https://wodbook.pages.dev/src/img/og-image.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:site_name" content="WODBOOK">

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://wodbook.pages.dev/">
    <meta name="twitter:title" content="WODBOOK - Agende. Treine. Supere.">
    <meta name="twitter:description" content="Sistema de agendamento para academias de CrossFit. Agende suas aulas, gerencie seus treinos e evolua com a WODBOOK.">
    <meta name="twitter:image" content="https://wodbook.pages.dev/src/img/og-image.jpg">

    <!-- WhatsApp e outras redes -->
    <meta property="og:image:alt" content="Logo WODBOOK">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://wodbook.pages.dev/">
    
    <!-- CSP -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self' https: data: blob:;
        connect-src 'self' https: wss: ws: http://127.0.0.1:* http://localhost:* https://*.supabase.co;
        script-src 'self' 'unsafe-inline' 'unsafe-eval' https:;
        style-src 'self' 'unsafe-inline' https:;
        img-src 'self' data: https: http:;
        font-src 'self' data: https:;
        worker-src 'self' blob:;
    ">

    <!-- jsPDF e autoTable via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    
    <!-- Tailwind & Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- 🔥 CSS Principal (contém todas as definições) -->
    <link rel="stylesheet" href="src/styles.css">
    
    <!-- Estilos mínimos (apenas o essencial para o funcionamento) -->
    <style>
        * { font-family: 'Inter', sans-serif; }
        
        .pulse-dot {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <!-- Overlay -->
    <div id="sidebarOverlay" class="sidebar-overlay" onclick="window.toggleSidebarMobile()"></div>
    
    <!-- Sidebar -->
    <div id="sidebarContainer"></div>
    
    <!-- Main Content -->
    <main class="main-content">
        <header class="bg-white border-b border-gray-200 px-4 md:px-6 py-4 sticky top-0 z-30 shadow-sm">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-4">
                    <!-- Botão Hamburguer (mobile) -->
                    <button onclick="window.toggleSidebarMobile()" class="md:hidden text-gray-600 hover:text-[#F4742B] transition text-2xl">
                        <i class="fas fa-bars"></i>
                    </button>
                    
                    <!-- Botão Collapse (desktop) -->
                    <button id="btnCollapse" class="hidden md:block text-gray-400 hover:text-[#F4742B] transition menu-toggle">
                        <i class="fas fa-chevron-left text-xl"></i>
                    </button>
                    
                    <!-- Título da Página -->
                    <div>
                        <h2 class="text-xl font-bold text-[#4B4B4D]">
                            <span id="pageTitle">Dashboard</span>
                        </h2>
                        <p class="text-sm text-gray-500 hidden md:block" id="pageSubtitle">Bem-vindo de volta ao seu treino</p>
                    </div>
                </div>
                
                <!-- Ações do Header -->
                <div class="flex items-center gap-4">
                    <!-- Notificações -->
                    <div class="relative">
                        <button id="btnNotificacoes" 
                                onclick="window.toggleDropdownNotificacoes()" 
                                class="relative text-gray-400 hover:text-[#F4742B] transition p-2 rounded-lg hover:bg-gray-100">
                            <i class="fas fa-bell text-xl"></i>
                            <span id="badgeNotificacoes" 
                                  class="absolute -top-1 -right-1 bg-[#F4742B] text-white text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center hidden">
                                0
                            </span>
                        </button>
                        
                        <!-- Dropdown de Notificações -->
                        <div id="notificacoesDropdown" 
                             class="absolute right-0 mt-2 w-80 bg-white rounded-xl shadow-2xl border border-gray-100 overflow-hidden z-50 hidden">
                            <div class="p-3 border-b border-gray-100 bg-gray-50">
                                <div class="flex justify-between items-center">
                                    <h4 class="font-semibold text-gray-800 text-sm">Notificações</h4>
                                    <button onclick="window.fecharDropdownNotificacoes()" class="text-gray-400 hover:text-gray-600">
                                        <i class="fas fa-times text-sm"></i>
                                    </button>
                                </div>
                            </div>
                            <div id="notificacoesList">
                                <div class="p-4 text-center text-gray-500">
                                    <i class="fas fa-spinner fa-spin text-[#F4742B]"></i>
                                    <p class="text-sm mt-2">Carregando notificações...</p>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Status Online e Avatar -->
                    <div class="hidden md:flex items-center gap-3">
                        <span class="bg-[#FEF3E8] text-[#F4742B] px-3 py-1 rounded-full text-sm font-medium">
                            <span class="pulse-dot inline-block w-2 h-2 bg-[#F4742B] rounded-full mr-1"></span>
                            Online
                        </span>
                        <img id="userAvatarHeader" src="https://ui-avatars.com/api/?name=Usuário&background=F4742B&color=fff" 
                             alt="Avatar" class="w-10 h-10 rounded-full border-2 border-[#F4742B]">
                    </div>
                </div>
            </div>
        </header>
        
        <!-- Conteúdo da página -->
        <div id="pageContent" class="p-4 md:p-6">
            <div class="page-loader">
                <i class="fas fa-spinner fa-spin"></i>
            </div>
        </div>
    </main>
    
    <!-- Rodapé -->
    <div id="footerContainer"></div>
    
    <script type="module">
        // ============================================
        // IMPORTS
        // ============================================
        import { supabase, getCurrentUser } from './src/config/supabase.js';
        import { renderCalendar } from './src/components/calendar.js';
        import { loadPage, initRouter } from './src/modules/router.js';
        import { renderMenu, initMenuMobile, initCollapseDesktop } from './src/components/menu.js';
        import { confirmModal, successModal, errorModal, infoModal } from './src/components/modal.js';
        import { initNotificacoes } from './src/modules/notificacoes.js';
        import { initFooter } from './src/components/footer.js';
        import { setupLogout, updateUserAvatar, updateUserData } from './src/modules/shared.js';
        import { setupConfiguracoesEvents } from './src/modules/configuracoes.js';
        
        // ============================================
        // ELEMENTOS
        // ============================================
        const pageContent = document.getElementById('pageContent');
        const pageTitle = document.getElementById('pageTitle');
        const pageSubtitle = document.getElementById('pageSubtitle');
        const sidebarContainer = document.getElementById('sidebarContainer');
        
        console.log('🚀 Iniciando aplicação...');
        console.log('📦 pageContent:', !!pageContent);
        console.log('📦 sidebarContainer:', !!sidebarContainer);
        
        // ============================================
        // RENDERIZAR MENU
        // ============================================
        if (sidebarContainer) {
            sidebarContainer.innerHTML = renderMenu('dashboard');
            console.log('✅ Menu renderizado');
        } else {
            console.error('❌ sidebarContainer não encontrado!');
        }
        
        initMenuMobile();
        initCollapseDesktop();
        
        // ============================================
        // INICIALIZAR ROTEADOR
        // ============================================
        console.log('🔄 Inicializando router...');
        initRouter({ pageContent, pageTitle, pageSubtitle });
        
        // ============================================
        // NAVEGAÇÃO
        // ============================================
        function initNavigation() {
            const items = document.querySelectorAll('.nav-item[data-page]');
            console.log('📋 Itens do menu com data-page:', items.length);
            
            items.forEach(item => {
                item.addEventListener('click', function(e) {
                    e.preventDefault();
                    const page = this.dataset.page;
                    console.log('🔄 Navegando para:', page);
                    
                    if (page) {
                        document.querySelectorAll('.nav-item').forEach(el => {
                            el.classList.remove('active');
                            const icon = el.querySelector('i');
                            if (icon) icon.style.color = '';
                            el.classList.add('text-white/70', 'hover:text-white');
                        });
                        this.classList.add('active');
                        this.classList.remove('text-white/70', 'hover:text-white');
                        const icon = this.querySelector('i');
                        if (icon) icon.style.color = '#F4742B';
                        
                        loadPage(page);
                        
                        if (window.innerWidth <= 768 && window.toggleSidebarMobile) {
                            window.toggleSidebarMobile();
                        }
                    }
                });
            });
        }
        
        // ============================================
        // MENU MOBILE
        // ============================================
        window.toggleSidebarMobile = function() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            
            if (!sidebar || !overlay) return;
            
            const isOpen = sidebar.classList.contains('mobile-open');
            
            if (isOpen) {
                sidebar.classList.remove('mobile-open');
                overlay.classList.remove('active');
                document.body.style.overflow = '';
            } else {
                sidebar.classList.add('mobile-open');
                overlay.classList.add('active');
                document.body.style.overflow = 'hidden';
            }
        };
        
        // ============================================
        // FUNÇÕES GLOBAIS
        // ============================================
        window.abrirAgendamento = function(centroId, centroNome) {
            renderCalendar(centroId, centroNome);
        };
        
        // ============================================
        // INICIALIZAÇÃO
        // ============================================
        async function init() {
            try {
                console.log('🔄 Inicializando...');
                
                const user = await getCurrentUser();
                if (!user) {
                    window.location.href = '/login.html';
                    return;
                }
                
                console.log('✅ Usuário autenticado:', user.email);
                
                await updateUserData();
                console.log('👤 Role do usuário:', localStorage.getItem('userRole'));
                
                setupLogout();
                await updateUserAvatar();
                initNavigation();
                initNotificacoes(); 
                initFooter();
                setupConfiguracoesEvents();
                
                console.log('📄 Carregando dashboard...');
                loadPage('dashboard');
                
                console.log('✅ SPA iniciado com sucesso!');
            } catch (error) {
                console.error('❌ Erro na inicialização:', error);
            }
        }
        
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
