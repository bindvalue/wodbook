<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - WODBOOK</title>
    
    <link rel="icon" type="image/png" href="src/img/favicon.png">
    <link rel="shortcut icon" type="image/png" href="src/img/favicon.png">
    <link rel="apple-touch-icon" href="src/img/favicon.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        * { font-family: 'Inter', sans-serif; }
        
        .bg-gradient-custom {
            background: linear-gradient(135deg, #F4742B 0%, #E0601A 50%, #4B4B4D 100%);
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .register-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25);
        }
        
        .btn-primary {
            background: #F4742B;
            color: white;
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            background: #E0601A;
            transform: scale(1.02);
            box-shadow: 0 4px 15px rgba(244, 116, 43, 0.4);
        }
        
        .btn-primary:active {
            transform: scale(0.98);
        }
        
        .btn-google {
            background: white;
            color: #4B4B4D;
            border: 2px solid #E5E7EB;
            transition: all 0.3s ease;
        }
        
        .btn-google:hover {
            background: #F9FAFB;
            border-color: #F4742B;
            transform: scale(1.02);
        }
        
        .input-field {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #E5E7EB;
            border-radius: 10px;
            transition: all 0.3s ease;
            outline: none;
        }
        
        .input-field:focus {
            border-color: #F4742B;
            box-shadow: 0 0 0 3px rgba(244, 116, 43, 0.1);
        }
        
        .error-message {
            color: #EF4444;
            font-size: 14px;
            margin-top: 8px;
            display: none;
        }
        
        .error-message.show {
            display: block;
        }
        
        .success-message {
            color: #10B981;
            font-size: 14px;
            margin-top: 8px;
            display: none;
        }
        
        .success-message.show {
            display: block;
        }
        
        .password-strength {
            height: 4px;
            border-radius: 4px;
            margin-top: 8px;
            transition: all 0.3s ease;
            background: #E5E7EB;
        }
        
        .password-strength.weak { background: #EF4444; width: 33%; }
        .password-strength.medium { background: #F59E0B; width: 66%; }
        .password-strength.strong { background: #10B981; width: 100%; }
        
        .requisito-item.ativo { color: #10B981; }
        .requisito-item.inativo { color: #9CA3AF; }
    </style>
</head>
<body>
    <div class="min-h-screen bg-gradient-custom flex items-center justify-center p-4">
        <div class="register-card w-full max-w-md p-8 fade-in">
            <!-- Logo -->
            <div class="text-center mb-6">
                <div class="mx-auto w-24 h-24">
                    <img src="src/img/logo_wodbook.png" 
                         alt="WODBOOK" 
                         class="w-full h-full object-contain"
                         onerror="this.src='https://ui-avatars.com/api/?name=WODBOOK&background=F4742B&color=fff&size=80'">
                </div>
                <h1 class="text-2xl font-bold text-[#4B4B4D] mt-2">Criar Conta</h1>
                <p class="text-gray-500 text-sm mt-1">Comece sua jornada no WODBOOK</p>
            </div>
            
            <form id="registerForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        <i class="fas fa-user text-[#F4742B] mr-2"></i>Nome Completo *
                    </label>
                    <input type="text" id="nome" class="input-field" placeholder="Seu nome completo" required>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        <i class="fas fa-envelope text-[#F4742B] mr-2"></i>Email *
                    </label>
                    <input type="email" id="email" class="input-field" placeholder="seu@email.com" required autocomplete="email">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        <i class="fas fa-phone text-[#F4742B] mr-2"></i>Telefone
                    </label>
                    <input type="tel" id="telefone" class="input-field" placeholder="(11) 99999-9999" maxlength="15">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        <i class="fas fa-id-card text-[#F4742B] mr-2"></i>CPF
                    </label>
                    <input type="text" id="cpf" class="input-field" placeholder="123.456.789-00" maxlength="14">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        <i class="fas fa-lock text-[#F4742B] mr-2"></i>Senha *
                    </label>
                    <div class="relative">
                        <input type="password" id="password" class="input-field w-full pr-12" placeholder="Mínimo 6 caracteres" required minlength="6">
                        <button type="button" id="togglePassword" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-[#F4742B] transition">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <div class="password-strength" id="passwordStrength"></div>
                    <div class="text-xs space-y-1 mt-2" id="senhaRequisitos">
                        <p class="flex items-center gap-2 requisito-item" id="reqTamanho"><span class="text-gray-300">○</span> Pelo menos 6 caracteres</p>
                        <p class="flex items-center gap-2 requisito-item" id="reqMaiuscula"><span class="text-gray-300">○</span> Pelo menos uma letra maiúscula</p>
                        <p class="flex items-center gap-2 requisito-item" id="reqMinuscula"><span class="text-gray-300">○</span> Pelo menos uma letra minúscula</p>
                        <p class="flex items-center gap-2 requisito-item" id="reqNumero"><span class="text-gray-300">○</span> Pelo menos um número</p>
                        <p class="flex items-center gap-2 requisito-item" id="reqEspecial"><span class="text-gray-300">○</span> Pelo menos um caractere especial</p>
                    </div>
                    <p class="text-xs text-gray-400 mt-1" id="passwordHint">Digite uma senha forte</p>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        <i class="fas fa-check-circle text-[#F4742B] mr-2"></i>Confirmar Senha *
                    </label>
                    <div class="relative">
                        <input type="password" id="confirmPassword" class="input-field w-full pr-12" placeholder="Digite a senha novamente" required>
                        <button type="button" id="toggleConfirmPassword" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-[#F4742B] transition">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                
                <div class="flex items-start gap-2">
                    <input type="checkbox" id="termos" class="mt-1 w-4 h-4 text-[#F4742B] focus:ring-[#F4742B] border-gray-300 rounded">
                    <label for="termos" class="text-sm text-gray-600">
                        Li e concordo com os <a href="#" class="text-[#F4742B] hover:underline">Termos de Serviço</a>
                    </label>
                </div>
                
                <button type="submit" id="btnRegister" class="w-full btn-primary py-3 rounded-lg font-semibold flex items-center justify-center gap-2">
                    <i class="fas fa-user-plus"></i> Criar Conta
                </button>
            </form>
            
            <div class="relative my-6">
                <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-200"></div></div>
                <div class="relative flex justify-center text-sm"><span class="px-4 bg-white text-gray-500">ou continue com</span></div>
            </div>
            
            <button id="btnGoogle" class="w-full btn-google py-3 rounded-lg font-semibold flex items-center justify-center gap-2">
                <svg class="w-5 h-5" viewBox="0 0 24 24">...</svg>
                Cadastrar com Google
            </button>
            
            <p class="text-center text-sm text-gray-600 mt-6">
                Já tem conta? <a href="login.html" class="text-[#F4742B] font-semibold hover:underline">Faça login</a>
            </p>
            
            <div id="errorMessage" class="error-message mt-4"></div>
            <div id="successMessage" class="success-message mt-4"></div>
        </div>
    </div>
    
    <script type="module">
        import { supabase } from './src/config/supabase.js';
        import { updateUserData } from './src/modules/shared.js';
        
        // ============================================
        // ELEMENTOS
        // ============================================
        const registerForm = document.getElementById('registerForm');
        const nomeInput = document.getElementById('nome');
        const emailInput = document.getElementById('email');
        const telefoneInput = document.getElementById('telefone');
        const cpfInput = document.getElementById('cpf');
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const termosCheck = document.getElementById('termos');
        const btnRegister = document.getElementById('btnRegister');
        const btnGoogle = document.getElementById('btnGoogle');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const passwordStrength = document.getElementById('passwordStrength');
        const passwordHint = document.getElementById('passwordHint');
        const togglePassword = document.getElementById('togglePassword');
        const toggleConfirmPassword = document.getElementById('toggleConfirmPassword');
        
        // ============================================
        // FUNÇÕES
        // ============================================
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
            successMessage.classList.remove('show');
            setTimeout(() => errorMessage.classList.remove('show'), 5000);
        }
        
        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.classList.add('show');
            errorMessage.classList.remove('show');
            setTimeout(() => successMessage.classList.remove('show'), 5000);
        }
        
        function setLoading(isLoading) {
            if (isLoading) {
                btnRegister.disabled = true;
                btnRegister.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Criando conta...';
            } else {
                btnRegister.disabled = false;
                btnRegister.innerHTML = '<i class="fas fa-user-plus mr-2"></i>Criar Conta';
            }
        }
        
        // ============================================
        // VISUALIZAR SENHA
        // ============================================
        togglePassword.addEventListener('click', function() {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.querySelector('i').classList.toggle('fa-eye');
            this.querySelector('i').classList.toggle('fa-eye-slash');
        });
        
        toggleConfirmPassword.addEventListener('click', function() {
            const type = confirmPasswordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            confirmPasswordInput.setAttribute('type', type);
            this.querySelector('i').classList.toggle('fa-eye');
            this.querySelector('i').classList.toggle('fa-eye-slash');
        });
        
        // ============================================
        // MÁSCARAS
        // ============================================
        function mascaraTelefone(input) {
            let valor = input.value.replace(/\D/g, '');
            if (valor.length > 11) valor = valor.slice(0, 11);
            if (valor.length === 0) { input.value = ''; return; }
            
            let formatado = '';
            if (valor.length <= 2) {
                formatado = `(${valor}`;
            } else {
                formatado = `(${valor.substring(0, 2)}) `;
                if (valor.length <= 7) {
                    formatado += valor.substring(2);
                } else if (valor.length <= 10) {
                    formatado += `${valor.substring(2, 6)}-${valor.substring(6)}`;
                } else {
                    formatado += `${valor.substring(2, 7)}-${valor.substring(7)}`;
                }
            }
            input.value = formatado;
        }
        
        function mascaraCPF(input) {
            let valor = input.value.replace(/\D/g, '');
            if (valor.length > 11) valor = valor.slice(0, 11);
            if (valor.length === 0) { input.value = ''; return; }
            
            let formatado = '';
            if (valor.length <= 3) {
                formatado = valor;
            } else if (valor.length <= 6) {
                formatado = `${valor.substring(0, 3)}.${valor.substring(3)}`;
            } else if (valor.length <= 9) {
                formatado = `${valor.substring(0, 3)}.${valor.substring(3, 6)}.${valor.substring(6)}`;
            } else {
                formatado = `${valor.substring(0, 3)}.${valor.substring(3, 6)}.${valor.substring(6, 9)}-${valor.substring(9)}`;
            }
            input.value = formatado;
        }
        
        telefoneInput.addEventListener('input', function() { mascaraTelefone(this); });
        cpfInput.addEventListener('input', function() { mascaraCPF(this); });
        
        // ============================================
        // VALIDAÇÃO DE SENHA
        // ============================================
        function validarSenha(senha) {
            return {
                tamanho: senha.length >= 6,
                maiuscula: /[A-Z]/.test(senha),
                minuscula: /[a-z]/.test(senha),
                numero: /\d/.test(senha),
                especial: /[^a-zA-Z0-9]/.test(senha)
            };
        }
        
        function getForcaSenha(senha) {
            if (senha.length === 0) return { forca: 0, texto: 'Digite uma senha forte', cor: '#9CA3AF' };
            
            const req = validarSenha(senha);
            let pontos = 0;
            if (req.tamanho) pontos++;
            if (req.maiuscula) pontos++;
            if (req.minuscula) pontos++;
            if (req.numero) pontos++;
            if (req.especial) pontos++;
            
            if (pontos <= 2) return { forca: 1, texto: 'Senha fraca', cor: '#EF4444' };
            if (pontos <= 3) return { forca: 2, texto: 'Senha média', cor: '#F59E0B' };
            return { forca: 3, texto: 'Senha forte!', cor: '#10B981' };
        }
        
        function atualizarRequisitos(senha) {
            const req = validarSenha(senha);
            const ids = ['reqTamanho', 'reqMaiuscula', 'reqMinuscula', 'reqNumero', 'reqEspecial'];
            const chaves = ['tamanho', 'maiuscula', 'minuscula', 'numero', 'especial'];
            
            ids.forEach((id, index) => {
                const el = document.getElementById(id);
                if (el) {
                    const span = el.querySelector('span');
                    if (req[chaves[index]]) {
                        span.textContent = '✅';
                        span.className = 'text-green-500';
                        el.className = 'flex items-center gap-2 requisito-item text-green-600';
                    } else {
                        span.textContent = '○';
                        span.className = 'text-gray-300';
                        el.className = 'flex items-center gap-2 requisito-item text-gray-400';
                    }
                }
            });
        }
        
        passwordInput.addEventListener('input', function() {
            const senha = this.value;
            const resultado = getForcaSenha(senha);
            
            if (senha.length === 0) {
                passwordStrength.style.width = '0%';
                passwordStrength.style.background = '#E5E7EB';
                passwordHint.textContent = 'Digite uma senha forte';
                passwordHint.style.color = '#9CA3AF';
            } else {
                passwordStrength.style.width = resultado.forca === 1 ? '33%' : resultado.forca === 2 ? '66%' : '100%';
                passwordStrength.style.background = resultado.cor;
                passwordHint.textContent = resultado.texto;
                passwordHint.style.color = resultado.cor;
            }
            atualizarRequisitos(senha);
        });
        
        // ============================================
        // FUNÇÃO: Criar Perfil (SIMPLIFICADA)
        // ============================================
        async function criarPerfilUsuario(userId, email, nome, telefone, cpf) {
            console.log('📝 Criando perfil para:', userId);
            
            // Remover máscara do CPF se existir
            const cpfLimpo = cpf ? cpf.replace(/\D/g, '') : '';
            const cpfParaSalvar = cpfLimpo || null;
            
            try {
                // Tentar RPC
                const { data, error } = await supabase.rpc('criar_perfil_usuario', {
                    p_user_id: userId,
                    p_email: email,
                    p_nome: nome,
                    p_telefone: telefone || '',
                    p_cpf: cpfParaSalvar,
                    p_role: 'user'
                });
                
                if (error) {
                    console.warn('⚠️ RPC falhou:', error.message);
                    // Fallback: inserção direta
                    const { error: insertError } = await supabase
                        .from('usuarios')
                        .insert([{
                            id: userId,
                            nome: nome,
                            telefone: telefone || '',
                            cpf: cpfParaSalvar,
                            email: email,
                            role: 'user'
                        }]);
                    
                    if (insertError) {
                        console.error('❌ Erro ao criar perfil:', insertError);
                        return false;
                    }
                }
                
                console.log('✅ Perfil criado com sucesso!');
                return true;
                
            } catch (error) {
                console.error('❌ Erro:', error);
                return false;
            }
        }
        
        // ============================================
        // CADASTRO
        // ============================================
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const nome = nomeInput.value.trim();
            const email = emailInput.value.trim();
            const telefone = telefoneInput.value.trim();
            const cpf = cpfInput.value.trim();
            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;
            
            if (!nome || !email || !password || !confirmPassword) {
                showError('Preencha todos os campos obrigatórios');
                return;
            }
            
            if (password.length < 6) {
                showError('A senha deve ter pelo menos 6 caracteres');
                return;
            }
            
            if (!/[a-zA-Z]/.test(password) || !/\d/.test(password)) {
                showError('A senha deve conter letras e números');
                return;
            }
            
            if (password !== confirmPassword) {
                showError('As senhas não coincidem');
                return;
            }
            
            if (!termosCheck.checked) {
                showError('Aceite os termos de serviço');
                return;
            }
            
            setLoading(true);
            
            try {
                const { data, error } = await supabase.auth.signUp({
                    email,
                    password,
                    options: {
                        data: { nome, telefone: telefone || '', cpf: cpf || '' }
                    }
                });
                
                if (error) throw error;
                
                if (data.user) {
                    // Criar perfil
                    await criarPerfilUsuario(data.user.id, email, nome, telefone, cpf);
                    
                    showSuccess('✅ Conta criada! Verifique seu email para confirmar.');
                    registerForm.reset();
                    passwordStrength.style.width = '0%';
                    passwordStrength.style.background = '#E5E7EB';
                    passwordHint.textContent = 'Digite uma senha forte';
                    passwordHint.style.color = '#9CA3AF';
                    
                    setTimeout(() => {
                        window.location.href = '/login.html';
                    }, 4000);
                }
                
            } catch (error) {
                showError(error.message || 'Erro ao criar conta.');
                setLoading(false);
            } finally {
                btnRegister.disabled = false;
                btnRegister.innerHTML = '<i class="fas fa-user-plus mr-2"></i>Criar Conta';
            }
        });
        
        // ============================================
        // GOOGLE
        // ============================================
        btnGoogle.addEventListener('click', async () => {
            try {
                btnGoogle.disabled = true;
                btnGoogle.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Carregando...';
                
                const { error } = await supabase.auth.signInWithOAuth({
                    provider: 'google',
                    options: { redirectTo: window.location.origin + '/index.html' }
                });
                
                if (error) throw error;
                
            } catch (error) {
                showError('Erro ao fazer cadastro com Google');
                btnGoogle.disabled = false;
                btnGoogle.innerHTML = 'Cadastrar com Google';
            }
        });
        
        // ============================================
        // CHECK AUTH
        // ============================================
        async function checkAuth() {
            const { data: { user } } = await supabase.auth.getUser();
            if (user) {
                await updateUserData();
                window.location.href = '/index.html';
            }
        }
        
        document.addEventListener('DOMContentLoaded', checkAuth);
        console.log('📝 Página de cadastro carregada');
    </script>
</body>
</html>
