<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - WODBOOK</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="src/img/favicon.png">
    <link rel="shortcut icon" type="image/png" href="src/img/favicon.png">
    <link rel="apple-touch-icon" href="src/img/favicon.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        * { font-family: 'Inter', sans-serif; }
        
        .bg-gradient-custom {
            background: linear-gradient(135deg, #F4742B 0%, #E0601A 50%, #4B4B4D 100%);
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .register-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25);
        }
        
        .btn-primary {
            background: #F4742B;
            color: white;
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            background: #E0601A;
            transform: scale(1.02);
            box-shadow: 0 4px 15px rgba(244, 116, 43, 0.4);
        }
        
        .btn-primary:active {
            transform: scale(0.98);
        }
        
        .btn-google {
            background: white;
            color: #4B4B4D;
            border: 2px solid #E5E7EB;
            transition: all 0.3s ease;
        }
        
        .btn-google:hover {
            background: #F9FAFB;
            border-color: #F4742B;
            transform: scale(1.02);
        }
        
        .input-field {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #E5E7EB;
            border-radius: 10px;
            transition: all 0.3s ease;
            outline: none;
        }
        
        .input-field:focus {
            border-color: #F4742B;
            box-shadow: 0 0 0 3px rgba(244, 116, 43, 0.1);
        }
        
        .input-field.error {
            border-color: #EF4444;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1);
        }
        
        .error-message {
            color: #EF4444;
            font-size: 14px;
            margin-top: 8px;
            display: none;
        }
        
        .error-message.show {
            display: block;
        }
        
        .success-message {
            color: #10B981;
            font-size: 14px;
            margin-top: 8px;
            display: none;
        }
        
        .success-message.show {
            display: block;
        }
        
        .password-strength {
            height: 4px;
            border-radius: 4px;
            margin-top: 8px;
            transition: all 0.3s ease;
            background: #E5E7EB;
        }
        
        .password-strength.weak { background: #EF4444; width: 25%; }
        .password-strength.medium { background: #F59E0B; width: 50%; }
        .password-strength.strong { background: #10B981; width: 100%; }
    </style>
</head>
<body>
    <div class="min-h-screen bg-gradient-custom flex items-center justify-center p-4">
        <div class="register-card w-full max-w-md p-8 fade-in">
            <!-- Logo -->
            <div class="text-center mb-6">
                <div class="mx-auto w-24 h-24">
                    <img src="src/img/logo_wodbook.png" 
                         alt="WODBOOK" 
                         class="w-full h-full object-contain"
                         onerror="this.src='https://ui-avatars.com/api/?name=WODBOOK&background=F4742B&color=fff&size=80'">
                </div>
                <h1 class="text-2xl font-bold text-[#4B4B4D] mt-2">Criar Conta</h1>
                <p class="text-gray-500 text-sm mt-1">Comece sua jornada no WODBOOK</p>
            </div>
            
            <!-- Formulário de Cadastro -->
            <form id="registerForm" class="space-y-4">
                <!-- Nome -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        <i class="fas fa-user text-[#F4742B] mr-2"></i>Nome Completo *
                    </label>
                    <input 
                        type="text" 
                        id="nome" 
                        class="input-field"
                        placeholder="Seu nome completo"
                        required
                    >
                </div>
                
                <!-- Email -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        <i class="fas fa-envelope text-[#F4742B] mr-2"></i>Email *
                    </label>
                    <input 
                        type="email" 
                        id="email" 
                        class="input-field"
                        placeholder="seu@email.com"
                        required
                        autocomplete="email"
                    >
                </div>
                
                <!-- Telefone -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        <i class="fas fa-phone text-[#F4742B] mr-2"></i>Telefone
                    </label>
                    <input 
                        type="tel" 
                        id="telefone" 
                        class="input-field"
                        placeholder="(11) 99999-9999"
                        maxlength="15"
                    >
                </div>
                
                <!-- CPF -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        <i class="fas fa-id-card text-[#F4742B] mr-2"></i>CPF
                    </label>
                    <input 
                        type="text" 
                        id="cpf" 
                        class="input-field"
                        placeholder="123.456.789-00"
                        maxlength="14"
                    >
                </div>
                
                <!-- Senha -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        <i class="fas fa-lock text-[#F4742B] mr-2"></i>Senha *
                    </label>
                    <input 
                        type="password" 
                        id="password" 
                        class="input-field"
                        placeholder="Mínimo 6 caracteres"
                        required
                        autocomplete="new-password"
                    >
                    <div class="password-strength" id="passwordStrength"></div>
                    <p class="text-xs text-gray-400 mt-1" id="passwordHint">Digite uma senha forte</p>
                </div>
                
                <!-- Confirmar Senha -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        <i class="fas fa-check-circle text-[#F4742B] mr-2"></i>Confirmar Senha *
                    </label>
                    <input 
                        type="password" 
                        id="confirmPassword" 
                        class="input-field"
                        placeholder="Digite a senha novamente"
                        required
                        autocomplete="new-password"
                    >
                </div>
                
                <!-- Termos -->
                <div class="flex items-start gap-2">
                    <input type="checkbox" id="termos" class="mt-1 w-4 h-4 text-[#F4742B] focus:ring-[#F4742B] border-gray-300 rounded">
                    <label for="termos" class="text-sm text-gray-600">
                        Li e concordo com os 
                        <a href="#" class="text-[#F4742B] hover:underline">Termos de Serviço</a> 
                        e 
                        <a href="#" class="text-[#F4742B] hover:underline">Política de Privacidade</a>
                    </label>
                </div>
                
                <button 
                    type="submit" 
                    id="btnRegister"
                    class="w-full btn-primary py-3 rounded-lg font-semibold flex items-center justify-center gap-2"
                >
                    <i class="fas fa-user-plus"></i>
                    Criar Conta
                </button>
            </form>
            
            <!-- Separador -->
            <div class="relative my-6">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-gray-200"></div>
                </div>
                <div class="relative flex justify-center text-sm">
                    <span class="px-4 bg-white text-gray-500">ou continue com</span>
                </div>
            </div>
            
            <!-- Botão Google -->
            <button 
                id="btnGoogle"
                class="w-full btn-google py-3 rounded-lg font-semibold flex items-center justify-center gap-2"
            >
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Cadastrar com Google
            </button>
            
            <!-- Link para login -->
            <p class="text-center text-sm text-gray-600 mt-6">
                Já tem conta? 
                <a href="login.html" class="text-[#F4742B] font-semibold hover:underline">Faça login</a>
            </p>
            
            <!-- Mensagens -->
            <div id="errorMessage" class="error-message mt-4"></div>
            <div id="successMessage" class="success-message mt-4"></div>
        </div>
    </div>
    
    <script type="module">
        import { supabase } from './src/config/supabase.js';
        import { updateUserData } from './src/modules/shared.js';
        
        // ============================================
        // ELEMENTOS
        // ============================================
        const registerForm = document.getElementById('registerForm');
        const nomeInput = document.getElementById('nome');
        const emailInput = document.getElementById('email');
        const telefoneInput = document.getElementById('telefone');
        const cpfInput = document.getElementById('cpf');
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const termosCheck = document.getElementById('termos');
        const btnRegister = document.getElementById('btnRegister');
        const btnGoogle = document.getElementById('btnGoogle');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const passwordStrength = document.getElementById('passwordStrength');
        const passwordHint = document.getElementById('passwordHint');
        
        // ============================================
        // FUNÇÕES
        // ============================================
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
            successMessage.classList.remove('show');
            setTimeout(() => {
                errorMessage.classList.remove('show');
            }, 5000);
        }
        
        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.classList.add('show');
            errorMessage.classList.remove('show');
            setTimeout(() => {
                successMessage.classList.remove('show');
            }, 5000);
        }
        
        function setLoading(isLoading) {
            if (isLoading) {
                btnRegister.disabled = true;
                btnRegister.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Criando conta...';
            } else {
                btnRegister.disabled = false;
                btnRegister.innerHTML = '<i class="fas fa-user-plus mr-2"></i>Criar Conta';
            }
        }
        
        // ============================================
        // MÁSCARAS
        // ============================================
        function mascaraTelefone(input) {
            let valor = input.value.replace(/\D/g, '');
            if (valor.length > 11) valor = valor.slice(0, 11);
            
            if (valor.length === 0) {
                input.value = '';
                return;
            }
            
            let formatado = '';
            if (valor.length <= 2) {
                formatado = `(${valor}`;
            } else {
                formatado = `(${valor.substring(0, 2)}) `;
                if (valor.length <= 7) {
                    formatado += valor.substring(2);
                } else if (valor.length <= 10) {
                    formatado += `${valor.substring(2, 6)}-${valor.substring(6)}`;
                } else {
                    formatado += `${valor.substring(2, 7)}-${valor.substring(7)}`;
                }
            }
            input.value = formatado;
        }
        
        function mascaraCPF(input) {
            let valor = input.value.replace(/\D/g, '');
            if (valor.length > 11) valor = valor.slice(0, 11);
            
            if (valor.length === 0) {
                input.value = '';
                return;
            }
            
            let formatado = '';
            if (valor.length <= 3) {
                formatado = valor;
            } else if (valor.length <= 6) {
                formatado = `${valor.substring(0, 3)}.${valor.substring(3)}`;
            } else if (valor.length <= 9) {
                formatado = `${valor.substring(0, 3)}.${valor.substring(3, 6)}.${valor.substring(6)}`;
            } else {
                formatado = `${valor.substring(0, 3)}.${valor.substring(3, 6)}.${valor.substring(6, 9)}-${valor.substring(9)}`;
            }
            input.value = formatado;
        }
        
        // ============================================
        // VALIDAÇÃO DE SENHA
        // ============================================
        passwordInput.addEventListener('input', function() {
            const senha = this.value;
            let forca = 0;
            
            if (senha.length >= 6) forca++;
            if (senha.length >= 10) forca++;
            if (/[a-z]/.test(senha) && /[A-Z]/.test(senha)) forca++;
            if (/\d/.test(senha)) forca++;
            if (/[^a-zA-Z0-9]/.test(senha)) forca++;
            
            passwordStrength.className = 'password-strength';
            
            if (senha.length === 0) {
                passwordStrength.style.width = '0%';
                passwordHint.textContent = 'Digite uma senha forte';
                passwordHint.style.color = '#9CA3AF';
                return;
            }
            
            if (forca <= 2) {
                passwordStrength.classList.add('weak');
                passwordHint.textContent = 'Senha fraca';
                passwordHint.style.color = '#EF4444';
            } else if (forca <= 4) {
                passwordStrength.classList.add('medium');
                passwordHint.textContent = 'Senha média';
                passwordHint.style.color = '#F59E0B';
            } else {
                passwordStrength.classList.add('strong');
                passwordHint.textContent = 'Senha forte!';
                passwordHint.style.color = '#10B981';
            }
        });
        
        // ============================================
        // MASCARAS NOS INPUTS
        // ============================================
        telefoneInput.addEventListener('input', function() {
            mascaraTelefone(this);
        });
        
        cpfInput.addEventListener('input', function() {
            mascaraCPF(this);
        });
        
        // ============================================
        // CADASTRO
        // ============================================
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const nome = nomeInput.value.trim();
            const email = emailInput.value.trim();
            const telefone = telefoneInput.value.trim();
            const cpf = cpfInput.value.trim();
            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;
            
            // Validações
            if (!nome || !email || !password || !confirmPassword) {
                showError('Preencha todos os campos obrigatórios');
                return;
            }
            
            if (password.length < 6) {
                showError('A senha deve ter pelo menos 6 caracteres');
                return;
            }
            
            if (password !== confirmPassword) {
                showError('As senhas não coincidem');
                return;
            }
            
            if (!termosCheck.checked) {
                showError('Você precisa aceitar os termos de serviço');
                return;
            }
            
            setLoading(true);
            
            try {
                // Criar usuário no Supabase Auth
                const { data, error } = await supabase.auth.signUp({
                    email,
                    password,
                    options: {
                        data: {
                            nome: nome,
                            telefone: telefone || '',
                            cpf: cpf || ''
                        }
                    }
                });
                
                if (error) throw error;
                
                // Se o usuário foi criado com sucesso
                if (data.user) {
                    showSuccess('✅ Conta criada com sucesso! Verifique seu email para confirmar o cadastro.');
                    
                    // Limpar formulário
                    registerForm.reset();
                    passwordStrength.style.width = '0%';
                    passwordHint.textContent = 'Digite uma senha forte';
                    passwordHint.style.color = '#9CA3AF';
                    
                    // Aguardar o usuário confirmar o email antes de redirecionar
                    setTimeout(() => {
                        window.location.href = '/login.html';
                    }, 4000);
                }
                
            } catch (error) {
                console.error('Erro no cadastro:', error);
                
                if (error.message.includes('User already registered')) {
                    showError('Este email já está cadastrado. Faça login ou use "Esqueceu a senha".');
                } else if (error.message.includes('Password should be at least 6 characters')) {
                    showError('A senha deve ter pelo menos 6 caracteres');
                } else {
                    showError(error.message || 'Erro ao criar conta. Tente novamente.');
                }
                setLoading(false);
            }
        });
        
        // ============================================
        // CADASTRO COM GOOGLE
        // ============================================
        btnGoogle.addEventListener('click', async () => {
            try {
                btnGoogle.disabled = true;
                btnGoogle.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Carregando...';
                
                const { data, error } = await supabase.auth.signInWithOAuth({
                    provider: 'google',
                    options: {
                        redirectTo: window.location.origin + '/index.html'
                    }
                });
                
                if (error) throw error;
                
            } catch (error) {
                console.error('Erro no cadastro com Google:', error);
                showError('Erro ao fazer cadastro com Google');
                btnGoogle.disabled = false;
                btnGoogle.innerHTML = 'Cadastrar com Google';
            }
        });
        
        // ============================================
        // VERIFICAR SE JÁ ESTÁ LOGADO
        // ============================================
        async function checkAuth() {
            const { data: { user } } = await supabase.auth.getUser();
            if (user) {
                window.location.href = '/index.html';
            }
        }
        
        // ============================================
        // INICIALIZAÇÃO
        // ============================================
        document.addEventListener('DOMContentLoaded', checkAuth);
        
        console.log('📝 Página de cadastro carregada');
    </script>
</body>
</html>
