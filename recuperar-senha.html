<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha - WODBOOK</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="src/img/favicon.png">
    <link rel="shortcut icon" type="image/png" href="src/img/favicon.png">
    <link rel="apple-touch-icon" href="src/img/favicon.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        * { font-family: 'Inter', sans-serif; }
        
        .bg-gradient-custom {
            background: linear-gradient(135deg, #F4742B 0%, #E0601A 50%, #4B4B4D 100%);
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25);
        }
        
        .btn-primary {
            background: #F4742B;
            color: white;
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            background: #E0601A;
            transform: scale(1.02);
            box-shadow: 0 4px 15px rgba(244, 116, 43, 0.4);
        }
        
        .btn-primary:active {
            transform: scale(0.98);
        }
        
        .btn-outline {
            background: transparent;
            color: #4B4B4D;
            border: 2px solid #E5E7EB;
            transition: all 0.3s ease;
        }
        
        .btn-outline:hover {
            background: #F9FAFB;
            border-color: #F4742B;
        }
        
        .input-field {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #E5E7EB;
            border-radius: 10px;
            transition: all 0.3s ease;
            outline: none;
        }
        
        .input-field:focus {
            border-color: #F4742B;
            box-shadow: 0 0 0 3px rgba(244, 116, 43, 0.1);
        }
        
        .input-field.error {
            border-color: #EF4444;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1);
        }
        
        .input-field.success {
            border-color: #10B981;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
        }
        
        .error-message {
            color: #EF4444;
            font-size: 14px;
            margin-top: 8px;
            display: none;
        }
        
        .error-message.show {
            display: block;
        }
        
        .success-message {
            color: #10B981;
            font-size: 14px;
            margin-top: 8px;
            display: none;
        }
        
        .success-message.show {
            display: block;
        }
        
        .step-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 24px;
        }
        
        .step-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #E5E7EB;
            transition: all 0.3s ease;
        }
        
        .step-dot.active {
            background: #F4742B;
            transform: scale(1.2);
        }
        
        .step-dot.done {
            background: #10B981;
        }
        
        .step-line {
            width: 40px;
            height: 2px;
            background: #E5E7EB;
            transition: all 0.3s ease;
        }
        
        .step-line.done {
            background: #10B981;
        }
    </style>
</head>
<body>
    <div class="min-h-screen bg-gradient-custom flex items-center justify-center p-4">
        <div class="card w-full max-w-md p-8 fade-in">
            <!-- Logo -->
            <div class="text-center mb-6">
                <div class="mx-auto w-20 h-20">
                    <img src="src/img/logo_wodbook.png" 
                         alt="WODBOOK" 
                         class="w-full h-full object-contain"
                         onerror="this.src='https://ui-avatars.com/api/?name=WODBOOK&background=F4742B&color=fff&size=80'">
                </div>
                <h1 class="text-2xl font-bold text-[#4B4B4D] mt-2" id="pageTitle">Recuperar Senha</h1>
                <p class="text-gray-500 text-sm mt-1" id="pageSubtitle">Digite seu email para receber o link de recuperação</p>
            </div>
            
            <!-- Step Indicator -->
            <div class="step-indicator">
                <div class="step-dot active" id="step1"></div>
                <div class="step-line" id="line1"></div>
                <div class="step-dot" id="step2"></div>
                <div class="step-line" id="line2"></div>
                <div class="step-dot" id="step3"></div>
            </div>
            
            <!-- STEP 1: Email -->
            <div id="stepEmail" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        <i class="fas fa-envelope text-[#F4742B] mr-2"></i>Email
                    </label>
                    <input 
                        type="email" 
                        id="email" 
                        class="input-field"
                        placeholder="seu@email.com"
                        required
                        autocomplete="email"
                    >
                </div>
                
                <button 
                    type="button" 
                    id="btnSendEmail"
                    class="w-full btn-primary py-3 rounded-lg font-semibold flex items-center justify-center gap-2"
                >
                    <i class="fas fa-paper-plane"></i>
                    Enviar Link de Recuperação
                </button>
                
                <div class="text-center">
                    <a href="login.html" class="text-sm text-[#F4742B] hover:underline font-medium">
                        <i class="fas fa-arrow-left mr-1"></i> Voltar para o login
                    </a>
                </div>
            </div>
            
            <!-- STEP 2: Aguardando (escondido) -->
            <div id="stepWaiting" class="hidden text-center py-4">
                <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i class="fas fa-check-circle text-green-600 text-3xl"></i>
                </div>
                <h3 class="text-lg font-bold text-gray-800">Email Enviado! 📧</h3>
                <p class="text-gray-500 text-sm mt-2">
                    Enviamos um link de recuperação para <strong id="emailEnviado"></strong>
                </p>
                <p class="text-gray-400 text-xs mt-2">
                    Verifique sua caixa de entrada e também a pasta de spam.
                </p>
                <button 
                    type="button" 
                    id="btnReenviar"
                    class="mt-4 text-sm text-[#F4742B] hover:underline font-medium"
                >
                    <i class="fas fa-redo mr-1"></i> Reenviar email
                </button>
            </div>
            
            <!-- STEP 3: Redefinir Senha (escondido) -->
            <div id="stepReset" class="hidden space-y-4">
                <div class="bg-blue-50 border border-blue-200 rounded-lg p-3 text-sm text-blue-700">
                    <i class="fas fa-info-circle mr-1"></i>
                    Digite sua nova senha. Ela deve ter pelo menos 6 caracteres.
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        <i class="fas fa-lock text-[#F4742B] mr-2"></i>Nova Senha
                    </label>
                    <div class="relative">
                        <input 
                            type="password" 
                            id="newPassword" 
                            class="input-field w-full pr-12"
                            placeholder="Mínimo 6 caracteres"
                            required
                            minlength="6"
                        >
                        <button 
                            type="button" 
                            id="toggleNewPassword" 
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-[#F4742B] transition"
                        >
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <div class="password-strength mt-2" id="passwordStrength"></div>
                    <p class="text-xs text-gray-400 mt-1" id="passwordHint">Digite uma senha forte</p>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        <i class="fas fa-check-circle text-[#F4742B] mr-2"></i>Confirmar Senha
                    </label>
                    <div class="relative">
                        <input 
                            type="password" 
                            id="confirmNewPassword" 
                            class="input-field w-full pr-12"
                            placeholder="Digite a senha novamente"
                            required
                        >
                        <button 
                            type="button" 
                            id="toggleConfirmNewPassword" 
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-[#F4742B] transition"
                        >
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                
                <button 
                    type="button" 
                    id="btnResetPassword"
                    class="w-full btn-primary py-3 rounded-lg font-semibold flex items-center justify-center gap-2"
                >
                    <i class="fas fa-key"></i>
                    Redefinir Senha
                </button>
            </div>
            
            <!-- Mensagens -->
            <div id="errorMessage" class="error-message mt-4"></div>
            <div id="successMessage" class="success-message mt-4"></div>
        </div>
    </div>
    
    <script type="module">
        import { supabase } from './src/config/supabase.js';
        
        // ============================================
        // ELEMENTOS
        // ============================================
        const emailInput = document.getElementById('email');
        const btnSendEmail = document.getElementById('btnSendEmail');
        const btnReenviar = document.getElementById('btnReenviar');
        const btnResetPassword = document.getElementById('btnResetPassword');
        const stepEmail = document.getElementById('stepEmail');
        const stepWaiting = document.getElementById('stepWaiting');
        const stepReset = document.getElementById('stepReset');
        const emailEnviado = document.getElementById('emailEnviado');
        const newPasswordInput = document.getElementById('newPassword');
        const confirmNewPasswordInput = document.getElementById('confirmNewPassword');
        const toggleNewPassword = document.getElementById('toggleNewPassword');
        const toggleConfirmNewPassword = document.getElementById('toggleConfirmNewPassword');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const pageTitle = document.getElementById('pageTitle');
        const pageSubtitle = document.getElementById('pageSubtitle');
        const passwordStrength = document.getElementById('passwordStrength');
        const passwordHint = document.getElementById('passwordHint');
        
        // Steps
        const step1 = document.getElementById('step1');
        const step2 = document.getElementById('step2');
        const step3 = document.getElementById('step3');
        const line1 = document.getElementById('line1');
        const line2 = document.getElementById('line2');
        
        let emailAtual = '';
        let token = null;
        
        // ============================================
        // FUNÇÕES
        // ============================================
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
            successMessage.classList.remove('show');
            setTimeout(() => {
                errorMessage.classList.remove('show');
            }, 5000);
        }
        
        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.classList.add('show');
            errorMessage.classList.remove('show');
            setTimeout(() => {
                successMessage.classList.remove('show');
            }, 5000);
        }
        
        function setLoading(btn, isLoading, text) {
            if (isLoading) {
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Carregando...';
            } else {
                btn.disabled = false;
                btn.innerHTML = text || btn.innerHTML;
            }
        }
        
        function updateSteps(step) {
            // Resetar todos
            [step1, step2, step3].forEach(s => s.className = 'step-dot');
            [line1, line2].forEach(l => l.className = 'step-line');
            
            if (step >= 1) {
                step1.classList.add('done');
                line1.classList.add('done');
            }
            if (step >= 2) {
                step2.classList.add('done');
                line2.classList.add('done');
            }
            if (step >= 3) {
                step3.classList.add('done');
            }
            
            // Ativar o step atual
            if (step === 1) step1.classList.add('active');
            else if (step === 2) step2.classList.add('active');
            else if (step === 3) step3.classList.add('active');
        }
        
        function goToStep(step) {
            stepEmail.classList.add('hidden');
            stepWaiting.classList.add('hidden');
            stepReset.classList.add('hidden');
            
            if (step === 1) {
                stepEmail.classList.remove('hidden');
                pageTitle.textContent = 'Recuperar Senha';
                pageSubtitle.textContent = 'Digite seu email para receber o link de recuperação';
            } else if (step === 2) {
                stepWaiting.classList.remove('hidden');
                pageTitle.textContent = 'Verifique seu Email';
                pageSubtitle.textContent = 'Enviamos o link de recuperação';
            } else if (step === 3) {
                stepReset.classList.remove('hidden');
                pageTitle.textContent = 'Redefinir Senha';
                pageSubtitle.textContent = 'Digite sua nova senha';
            }
            
            updateSteps(step);
        }
        
        // ============================================
        // VALIDAÇÃO DE SENHA
        // ============================================
        newPasswordInput.addEventListener('input', function() {
            const senha = this.value;
            let forca = 0;
            
            if (senha.length >= 6) forca++;
            if (senha.length >= 10) forca++;
            if (/[a-z]/.test(senha) && /[A-Z]/.test(senha)) forca++;
            if (/\d/.test(senha)) forca++;
            if (/[^a-zA-Z0-9]/.test(senha)) forca++;
            
            passwordStrength.className = 'password-strength mt-2';
            
            if (senha.length === 0) {
                passwordStrength.style.width = '0%';
                passwordHint.textContent = 'Digite uma senha forte';
                passwordHint.style.color = '#9CA3AF';
                return;
            }
            
            if (forca <= 2) {
                passwordStrength.style.background = '#EF4444';
                passwordStrength.style.width = '25%';
                passwordStrength.style.height = '4px';
                passwordStrength.style.borderRadius = '4px';
                passwordHint.textContent = 'Senha fraca';
                passwordHint.style.color = '#EF4444';
            } else if (forca <= 4) {
                passwordStrength.style.background = '#F59E0B';
                passwordStrength.style.width = '50%';
                passwordStrength.style.height = '4px';
                passwordStrength.style.borderRadius = '4px';
                passwordHint.textContent = 'Senha média';
                passwordHint.style.color = '#F59E0B';
            } else {
                passwordStrength.style.background = '#10B981';
                passwordStrength.style.width = '100%';
                passwordStrength.style.height = '4px';
                passwordStrength.style.borderRadius = '4px';
                passwordHint.textContent = 'Senha forte!';
                passwordHint.style.color = '#10B981';
            }
        });
        
        // ============================================
        // VISUALIZAR SENHA
        // ============================================
        toggleNewPassword.addEventListener('click', function() {
            const type = newPasswordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            newPasswordInput.setAttribute('type', type);
            this.querySelector('i').classList.toggle('fa-eye');
            this.querySelector('i').classList.toggle('fa-eye-slash');
        });
        
        toggleConfirmNewPassword.addEventListener('click', function() {
            const type = confirmNewPasswordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            confirmNewPasswordInput.setAttribute('type', type);
            this.querySelector('i').classList.toggle('fa-eye');
            this.querySelector('i').classList.toggle('fa-eye-slash');
        });
        
        // ============================================
        // STEP 1: ENVIAR EMAIL
        // ============================================
        btnSendEmail.addEventListener('click', async () => {
            const email = emailInput.value.trim();
            
            if (!email) {
                showError('Por favor, informe seu email');
                return;
            }
            
            if (!email.includes('@') || !email.includes('.')) {
                showError('Por favor, informe um email válido');
                return;
            }
            
            setLoading(btnSendEmail, true);
            
            try {
                const { error } = await supabase.auth.resetPasswordForEmail(email, {
                    redirectTo: window.location.origin + '/recuperar-senha.html'
                });
                
                if (error) throw error;
                
                emailAtual = email;
                emailEnviado.textContent = email;
                
                showSuccess('Link de recuperação enviado com sucesso!');
                goToStep(2);
                
            } catch (error) {
                console.error('Erro ao enviar email:', error);
                if (error.message.includes('User not found')) {
                    showError('Email não encontrado. Verifique o endereço informado.');
                } else {
                    showError(error.message || 'Erro ao enviar email. Tente novamente.');
                }
            } finally {
                setLoading(btnSendEmail, false, '<i class="fas fa-paper-plane mr-2"></i>Enviar Link de Recuperação');
            }
        });
        
        // ============================================
        // REENVIAR EMAIL
        // ============================================
        btnReenviar.addEventListener('click', async () => {
            if (!emailAtual) {
                showError('Email não encontrado. Volte e tente novamente.');
                return;
            }
            
            setLoading(btnReenviar, true);
            
            try {
                const { error } = await supabase.auth.resetPasswordForEmail(emailAtual, {
                    redirectTo: window.location.origin + '/recuperar-senha.html'
                });
                
                if (error) throw error;
                
                showSuccess('Email reenviado com sucesso!');
                
            } catch (error) {
                console.error('Erro ao reenviar email:', error);
                showError(error.message || 'Erro ao reenviar email. Tente novamente.');
            } finally {
                setLoading(btnReenviar, false, '<i class="fas fa-redo mr-1"></i> Reenviar email');
            }
        });
        
        // ============================================
        // STEP 3: REDEFINIR SENHA
        // ============================================
        btnResetPassword.addEventListener('click', async () => {
            const newPassword = newPasswordInput.value;
            const confirmPassword = confirmNewPasswordInput.value;
            
            if (!newPassword || !confirmPassword) {
                showError('Preencha todos os campos');
                return;
            }
            
            if (newPassword.length < 6) {
                showError('A senha deve ter pelo menos 6 caracteres');
                return;
            }
            
            if (newPassword !== confirmPassword) {
                showError('As senhas não coincidem');
                return;
            }
            
            setLoading(btnResetPassword, true);
            
            try {
                const { error } = await supabase.auth.updateUser({
                    password: newPassword
                });
                
                if (error) throw error;
                
                showSuccess('✅ Senha redefinida com sucesso! Redirecionando...');
                
                setTimeout(() => {
                    window.location.href = '/login.html';
                }, 2000);
                
            } catch (error) {
                console.error('Erro ao redefinir senha:', error);
                showError(error.message || 'Erro ao redefinir senha. Tente novamente.');
            } finally {
                setLoading(btnResetPassword, false, '<i class="fas fa-key mr-2"></i>Redefinir Senha');
            }
        });
        
        // ============================================
        // ENTER PARA ENVIAR
        // ============================================
        emailInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                btnSendEmail.click();
            }
        });
        
        newPasswordInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                btnResetPassword.click();
            }
        });
        
        confirmNewPasswordInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                btnResetPassword.click();
            }
        });
        
        // ============================================
        // VERIFICAR PARÂMETROS DA URL (para o step 3)
        // ============================================
        function checkUrlParams() {
            const params = new URLSearchParams(window.location.search);
            const type = params.get('type');
            
            // Se veio de um link de recuperação
            if (type === 'recovery') {
                goToStep(3);
                showSuccess('Link de recuperação validado! Defina sua nova senha.');
            }
        }
        
        // ============================================
        // INICIALIZAÇÃO
        // ============================================
        document.addEventListener('DOMContentLoaded', () => {
            goToStep(1);
            checkUrlParams();
            console.log('🔐 Página de recuperação de senha carregada');
        });
    </script>
</body>
</html>
